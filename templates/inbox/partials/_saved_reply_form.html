<!-- Saved reply create/edit form partial -->
<div class="max-w-lg">
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_title" class="block text-13 font-semibold text-ink mb-1">Title</label>
                {{ form.title }}
            </div>
            <div>
                <label for="id_body" class="block text-13 font-semibold text-ink mb-1">Reply Body</label>
                {{ form.body }}
                <p class="text-12 text-ink-muted mt-1">Variables: <code>{sender_name}</code>, <code>{account_name}</code>, <code>{post_url}</code></p>
            </div>
        </div>
        <div class="flex items-center gap-3 mt-6">
            <button type="submit"
                    class="inline-flex items-center gap-1.5 px-5 py-2 text-13 font-semibold text-on-accent rounded-control transition-all duration-150 cursor-pointer"
                    style="background: var(--primary); box-shadow: var(--shadow-primary);">
                {% if saved_reply %}Update{% else %}Create{% endif %} Reply
            </button>
            <a href="{% url 'inbox:saved_replies' workspace_id=workspace.id %}"
               class="text-13 font-medium text-ink-muted hover:text-ink transition-colors">Cancel</a>
        </div>
    </form>
</div>
