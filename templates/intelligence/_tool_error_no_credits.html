<div class="mt-3 p-3 rounded-control border border-warning/30 bg-warning-soft text-12 text-warning">
  <div class="font-semibold mb-1">Out of credits</div>
  <div>Upgrade your plan or top up to keep using Intelligence.</div>
  <form method="post" action="{% url 'intelligence:portal' org_id=organization.id %}" class="mt-2">
    {% csrf_token %}
    <button type="submit"
            class="px-3 py-1 text-12 font-semibold text-on-accent bg-warning rounded-control hover:bg-warning cursor-pointer">
      Manage billing →
    </button>
  </form>
</div>
