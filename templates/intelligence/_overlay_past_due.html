<div class="absolute inset-0 flex items-center justify-center bg-surface/85 rounded-control">
  <div class="text-center max-w-md px-6">
    <h2 class="text-16 font-semibold text-ink mb-2">Your subscription is past due</h2>
    <p class="text-14 text-ink-muted mb-5">
      Update your payment method to continue using Intelligence.
    </p>
    {% if can_manage_billing %}
      <form method="post" action="{% url 'intelligence:portal' org_id=organization.id %}">
        {% csrf_token %}
        <button type="submit"
                class="inline-flex items-center px-6 py-2 text-14 font-semibold text-on-accent bg-accent rounded-control hover:bg-accent-hover cursor-pointer">
          Update payment →
        </button>
      </form>
    {% else %}
      <p class="text-14 text-ink-muted">Ask an org admin to update payment.</p>
    {% endif %}
  </div>
</div>
