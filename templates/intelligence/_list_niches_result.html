<div class="max-h-[400px] overflow-y-auto -m-1 p-1">
    <ul class="space-y-1">
        {% for niche in result.niches %}
        <li class="flex items-center justify-between gap-3 py-2 px-2 rounded-control hover:bg-sunken">
            <div class="min-w-0">
                <div class="text-14 font-medium text-ink truncate">{{ niche.name }}</div>
                <div class="text-12 font-mono text-ink-muted truncate">{{ niche.slug }}</div>
            </div>
            <span class="text-12 flex-shrink-0 px-2 py-0.5 rounded-control bg-sunken text-ink-muted font-medium">{{ niche.gap_count }} gaps</span>
        </li>
        {% empty %}
        <li class="text-14 text-ink-muted py-2">No niches available.</li>
        {% endfor %}
    </ul>
</div>
