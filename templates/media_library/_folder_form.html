{% comment %}Modal for creating a new folder. Expects: workspace{% endcomment %}

<div class="fixed inset-0 z-50 flex items-center justify-center" @keydown.escape.window="showNewFolder = false">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-scrim/30" @click="showNewFolder = false"></div>

  <!-- Modal -->
  <div class="relative bg-surface rounded-panel shadow-menu w-full max-w-sm mx-4 p-6"
       @click.stop>
    <h3 class="text-16 font-semibold mb-4" style="color: var(--text-primary, var(--text-primary));">New Folder</h3>

    <form hx-post="{% url 'media_library:folder_create' workspace_id=workspace.id %}"
          hx-target="#folder-tree"
          hx-swap="innerHTML"
          @htmx:after-request="showNewFolder = false">
      <input type="text" name="name" placeholder="Folder name..."
             class="input-focus w-full text-14 px-3 py-2 border rounded-control outline-none mb-4"
             style="border-color: var(--border, var(--hairline));"
             required autofocus>

      <div class="flex justify-end gap-2">
        <button type="button" @click="showNewFolder = false"
                class="btn-surface-2 px-4 py-2 text-14 font-medium rounded-control transition-colors cursor-pointer"
                style="color: var(--text-secondary, var(--text-secondary));">
          Cancel
        </button>
        <button type="submit"
                class="btn-primary-hover px-4 py-2 text-14 font-semibold text-on-accent rounded-control transition-colors cursor-pointer"
                style="background: var(--primary, var(--accent));">
          Create Folder
        </button>
      </div>
    </form>
  </div>
</div>
