{% comment %}Shown after the unsubscribe POST. Standalone for the same reason.{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribed</title>
</head>
<body style="margin:0;padding:0;background-color: var(--canvas);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color: var(--text-primary);">
  <div style="max-width:480px;margin:0 auto;padding:48px 20px;">
    <div style="background-color: var(--surface);border: 1px solid var(--hairline);border-radius: var(--radius-panel);padding:32px;">
      <h1 style="margin:0 0 12px;font-size: 1.25rem;font-weight:700;">Done</h1>
      <p style="margin:0;font-size: 0.875rem;line-height:1.6;color: var(--text-secondary);">
        You'll no longer receive <strong>{{ label }}</strong> emails. They'll still appear in the
        app, and you can turn them back on under Notification preferences.
      </p>
    </div>
  </div>
{% include "about/_public_footer.html" %}
</body>
</html>
