{# Top of the rail: the studio wordmark (monogram when collapsed). #}
<div class="flex items-center h-14 px-4 border-b border-hairline flex-shrink-0" :class="sidebarCollapsed ? 'justify-center px-0' : ''">
    <a href="{{ shell_all_clients_url|default:'/' }}" class="wordmark truncate" x-show="!sidebarCollapsed" aria-label="{{ SITE_NAME }}: all clients">{{ SITE_NAME }}</a>
    <a href="{{ shell_all_clients_url|default:'/' }}" class="wordmark" x-show="sidebarCollapsed" x-cloak aria-label="{{ SITE_NAME }}: all clients">{{ SITE_NAME|make_list|first }}</a>
</div>
