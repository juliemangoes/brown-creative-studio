{# Top of the rail: monogram and studio wordmark (monogram alone when collapsed). #}
<div class="flex items-center h-14 px-4 flex-shrink-0" :class="sidebarCollapsed ? 'justify-center px-0' : ''">
    <a href="{{ shell_all_clients_url|default:'/' }}" class="wordmark min-w-0" aria-label="{{ SITE_NAME }}: all clients">
        <span class="sidebar-logo-mark" aria-hidden="true">{{ SITE_NAME|make_list|first }}</span>
        <span class="truncate" x-show="!sidebarCollapsed">{{ SITE_NAME }}</span>
    </a>
</div>
