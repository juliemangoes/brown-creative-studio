<!DOCTYPE html>
<html lang="en"><body style="margin:0;padding:24px;background:#F7F3EE;font-family:Arial,Helvetica,sans-serif;color:#2B211B;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E6DED5;border-radius:10px;"><tr><td style="padding:28px;">
<p style="margin:0 0 16px;font-size:16px;">Hello {{ user.name|default:"there" }},</p>
<p style="margin:0 0 12px;font-size:16px;line-height:24px;">A quick reminder: {{ workspace.name }}'s onboarding still has {{ left|length }} step{{ left|length|pluralize }} to go.</p>
<ul style="margin:0 0 20px;padding-left:20px;font-size:15px;line-height:22px;color:#5C4D42;">{% for step in left %}<li>{{ step.get_key_display }}</li>{% endfor %}</ul>
<p style="margin:0 0 20px;"><a href="{{ portal_url }}" style="display:inline-block;background:#6B4F3A;color:#FFFFFF;text-decoration:none;padding:12px 18px;border-radius:6px;font-size:16px;">Continue</a></p>
<p style="margin:0;font-size:13px;color:#7A6A5E;">This link signs you in once.</p>
</td></tr></table>
<p style="text-align:center;font-size:12px;color:#7A6A5E;margin-top:16px;">{{ site_name }}</p>
</body></html>
