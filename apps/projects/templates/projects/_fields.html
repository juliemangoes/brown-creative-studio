{% for field in form %}{% if field.is_hidden %}{{ field }}{% elif field.field.widget.input_type == "checkbox" %}
<label class="flex items-center gap-2 text-14" for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
{% else %}
<div class="field"><label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="meta mt-1">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>
{% endif %}{% endfor %}
