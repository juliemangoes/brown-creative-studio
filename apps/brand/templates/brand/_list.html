{% if items %}<ul class="space-y-1 text-14">{% for item in items %}<li>{% if item.name %}<span class="font-medium">{{ item.name }}</span>{% if item.description %}: {{ item.description }}{% elif item.usage %}: {{ item.usage }}{% endif %}{% else %}{{ item }}{% endif %}</li>{% endfor %}</ul>{% else %}<p class="text-14 text-ink-muted">{{ empty|default:"Not written yet." }}</p>{% endif %}
